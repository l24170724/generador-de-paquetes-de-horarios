<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generador de paquetes</title>
  <style>
    :root {
      --negro: #1a1a1a;
      --blanco: #ffffff;
      --rosa-pastel: #f8d7e3;
      --rosa-fuerte: #e0306f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: var(--blanco); color: var(--negro); }
    header { background: var(--negro); color: var(--blanco); padding: 14px 24px; display: flex; flex-wrap: wrap;
             align-items: center; justify-content: space-between; gap: 12px; border-bottom: 4px solid var(--rosa-fuerte); }
    header h1 { margin: 0; font-size: 1.2rem; }
    nav a { color: var(--blanco); text-decoration: none; margin-left: 18px; padding-bottom: 4px; }
    nav a.activo, nav a:hover { color: var(--rosa-pastel); border-bottom: 2px solid var(--rosa-fuerte); }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }

    .tarjeta { background: var(--blanco); border: 1px solid var(--rosa-pastel); border-radius: 10px;
               padding: 18px 20px; margin-bottom: 18px; }
    h2 { margin: 0 0 14px; font-size: 1.15rem; }
    h3 { margin: 0 0 12px; font-size: 1rem; }
    small { font-weight: normal; }
    .fila-titulo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
    .fila-titulo h2 { margin: 0; }
    .columnas { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
    .columnas .tarjeta { margin-bottom: 0; }
    @media (max-width: 760px) { .columnas { grid-template-columns: 1fr; } }

    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rosa-pastel); vertical-align: middle; }
    thead th { font-weight: 600; font-size: .78rem; text-transform: uppercase; }
    td a { color: var(--rosa-fuerte); text-decoration: none; }
    .derecha { text-align: right; white-space: nowrap; }
    .vacio { text-align: center; padding: 18px; }
    tr.pendiente td { background: var(--rosa-pastel); font-weight: 600; }
    .desplazable { overflow-x: auto; }

    .paquetes { display: flex; flex-wrap: wrap; gap: 18px; }
    .paquete h3 { margin: 0 0 8px; }
    .horario th, .horario td { border: 1px solid var(--rosa-pastel); text-align: center; min-width: 64px; padding: 6px 8px; }
    .horario td.ocupada { background: var(--rosa-pastel); }
    .horario td strong { display: block; color: var(--rosa-fuerte); }
    .horario td span { display: block; font-size: .75rem; }

    .formulario { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px; margin: 10px 0; }
    .formulario > button { margin-top: 19px; }
    label { display: flex; flex-direction: column; font-size: .8rem; gap: 4px; }
    label.ancho { flex: 1; min-width: 200px; }
    .ayuda { font-size: .72rem; }
    input, select { font: inherit; padding: 8px 10px; border: 1px solid var(--negro); border-radius: 6px;
                    color: var(--negro); background: var(--blanco); }
    input:focus, select:focus { outline: 2px solid var(--rosa-fuerte); }
    button { font: inherit; font-size: .88rem; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--negro);
             background: var(--blanco); color: var(--negro); cursor: pointer; }
    button:hover { background: var(--rosa-pastel); }
    button.principal { background: var(--rosa-fuerte); border-color: var(--rosa-fuerte); color: var(--blanco); }
    button.principal:hover { background: var(--negro); border-color: var(--negro); }
    button.peligro { color: var(--rosa-fuerte); border-color: var(--rosa-fuerte); }
    button.grande { padding: 12px 22px; font-size: 1rem; }
    button.mini { padding: 4px 10px; font-size: .8rem; }

    .aviso { padding: 10px 14px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--rosa-fuerte); }
    .aviso.ok { background: var(--rosa-pastel); }
    .aviso.error { background: var(--blanco); color: var(--rosa-fuerte); border: 1px solid var(--rosa-fuerte);
                   border-left-width: 4px; font-weight: 600; }
    .etiqueta { font-size: .72rem; padding: 2px 8px; border-radius: 99px; margin-left: 6px;
                background: var(--rosa-pastel); }
    .nota { font-size: .88rem; line-height: 1.5; }
    .nota ol { margin: 6px 0 14px; padding-left: 20px; }

    .lista { list-style: none; padding: 0; margin: 0 0 10px; }
    .lista li { display: flex; justify-content: space-between; align-items: center; gap: 8px;
                padding: 6px 0; border-bottom: 1px solid var(--rosa-pastel); }
    .num { display: inline-block; width: 22px; }
    .acciones { display: flex; gap: 6px; }
    .horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; margin-bottom: 12px; }
    .hora-check { flex-direction: row; align-items: center; gap: 6px; font-size: .88rem;
                  border: 1px solid var(--rosa-pastel); border-radius: 6px; padding: 6px 8px; cursor: pointer; }
    .hora-check:has(input:checked) { background: var(--rosa-pastel); border-color: var(--rosa-fuerte); }
    .hora-check input { accent-color: var(--rosa-fuerte); }
  </style>
</head>
<body>
  <header>
    <h1>Generador de paquetes</h1>
    <nav>
      {% set ep = request.endpoint or '' %}
      <a href="{{ url_for('inicio') }}"     class="{{ 'activo' if ep == 'inicio' }}">Paquetes</a>
      <a href="{{ url_for('profesores') }}" class="{{ 'activo' if 'profesor' in ep }}">Maestros</a>
      <a href="{{ url_for('materias') }}"   class="{{ 'activo' if 'materia' in ep }}">Materias</a>
    </nav>
  </header>

  <main>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for tipo, texto in mensajes %}
        <div class="aviso {{ tipo }}">{{ texto }}</div>
      {% endfor %}
    {% endwith %}

    {% block contenido %}{% endblock %}
  </main>

  <script>
    //elimina mientras se escribe los caracteres que no permite cada tipo de campo
    var reglas = { clave: /[^A-Za-z0-9]/g, nombre: /[^A-Za-z0-9 ]/g, letra: /[^A-Za-z]/g };
    document.querySelectorAll("input[data-solo]").forEach(function (campo) {
      var tipo = campo.dataset.solo;
      campo.addEventListener("input", function () {
        var valor = campo.value.replace(reglas[tipo], "");
        campo.value = tipo === "letra" ? valor.toUpperCase() : valor;
      });
    });
  </script>
</body>
</html>
